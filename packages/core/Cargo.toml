[package]
name = "oaklet"
version = "0.1.0"
description = "Oaklet local code agent"
authors = ["you"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oaklet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "http2", "charset", "system-proxy"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
futures-util = "0.3"
portable-pty = "0.9.0"
ignore = "0.4"
globset = "0.4"
regex = "1"
base64 = "0.21"
rusqlite = { version = "0.42", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
