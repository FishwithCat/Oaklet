name: Test

# Runs the checks documented in CONTRIBUTING.md ("Checks") on every pull request
# and push to main. The Rust job runs on macOS, Windows, and Ubuntu 24.04; the
# release package itself is built by linux-release.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: packages/desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - name: Check the release manifest helper
        working-directory: ${{ github.workspace }}
        run: node --test scripts/release/*.test.mjs
      - run: pnpm build

  architecture-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/architecture-helper
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: packages/architecture-helper/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test

  rust:
    # macos-14 was retired by GitHub Actions on 2026-11-02.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      # tauri-build copies bundle resources into target/ on every build,
      # including cargo test, so the helper bundle must be built first.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: packages/architecture-helper/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: packages/architecture-helper

      - run: pnpm build
        working-directory: packages/architecture-helper

      - uses: dtolnay/rust-toolchain@stable
        # clippy and rustfmt are included by default.

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core

      - uses: actions/cache@v4
        with:
          path: packages/core/binaries
          key: node-sidecar-macos-15-22.23.3

      - name: Fetch the bundled Node.js runtime
        run: node scripts/fetch-node-sidecar.mjs

      - run: cargo test

      - run: cargo clippy --all-targets

  linux:
    # The fixed runner keeps the linked glibc and WebKitGTK inside the baseline
    # the first Linux release supports (Ubuntu 24.04 LTS).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: packages/architecture-helper/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: packages/architecture-helper

      # tauri-build copies bundle resources into target/ on every build,
      # including cargo test, so the helper bundle must be built first.
      - run: pnpm build
        working-directory: packages/architecture-helper

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core
          key: ubuntu-24.04

      - uses: actions/cache@v4
        with:
          path: packages/core/binaries
          key: node-sidecar-x86_64-unknown-linux-gnu-22.23.3

      - name: Fetch the bundled Node.js runtime
        run: node scripts/fetch-node-sidecar.mjs

      - run: cargo test

      - run: cargo clippy --all-targets

  windows:
    # The Windows runner image ships the MSVC desktop C++ workload, Windows SDK,
    # Edge WebView2 runtime, and Git for Windows, which Tauri and the Rust build
    # need. Tests exercise the same code paths the Windows installer ships.
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/desktop/pnpm-lock.yaml
            packages/architecture-helper/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core
          key: windows-msvc

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/desktop install --frozen-lockfile
          pnpm --dir packages/architecture-helper install --frozen-lockfile

      - name: Build the architecture helper
        # tauri-build copies bundle resources on every build, including cargo test.
        run: pnpm --dir packages/architecture-helper build

      - uses: actions/cache@v4
        with:
          path: packages/core/binaries
          key: node-sidecar-x86_64-pc-windows-msvc-22.23.3

      - name: Fetch the bundled Node.js runtime
        run: node packages/core/scripts/fetch-node-sidecar.mjs

      - name: Check the architecture helper
        run: pnpm --dir packages/architecture-helper test

      - name: Check the desktop frontend
        run: |
          pnpm --dir packages/desktop test
          pnpm --dir packages/desktop build

      - name: Check the Rust backend
        working-directory: packages/core
        run: |
          cargo test
          cargo clippy --all-targets
