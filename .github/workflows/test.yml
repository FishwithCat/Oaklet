name: Test

# Runs the checks documented in CONTRIBUTING.md ("Checks") on every pull request
# and push to main. Windows/Linux packaging is not covered yet; the Rust job uses
# macOS because that is the only platform Oaklet ships on.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  architecture-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: architecture-helper
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: architecture-helper/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  rust:
    # macos-14 was retired by GitHub Actions on 2026-11-02.
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        # clippy and rustfmt are included by default.

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core

      - run: cargo test

      - run: cargo clippy --all-targets
