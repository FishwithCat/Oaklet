name: macOS release

# Builds separate Apple Silicon and Intel Oaklet.app and .dmg bundles.
# Manual runs upload the bundles as workflow artifacts. Pushing a v* tag also
# publishes a GitHub Release.
#
# Update signing is required for tag releases. Set these repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Code signing and notarization are optional until a Developer ID certificate
# is available. Add these secrets to enable them (see CONTRIBUTING.md):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# or the App Store Connect API key pair:
#   APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_CONTENT
# Without them the build is ad-hoc signed: it runs, but Gatekeeper asks the
# user to allow it on first launch.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            updater: darwin-aarch64
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            updater: darwin-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      UPDATER_TARGET: ${{ matrix.updater }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/desktop/pnpm-lock.yaml
            packages/architecture-helper/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/desktop install --frozen-lockfile
          pnpm --dir packages/architecture-helper install --frozen-lockfile

      - name: Build the architecture helper
        # The helper is bundled to plain JavaScript, independent of the host
        # architecture, and Tauri embeds only this directory.
        run: pnpm --dir packages/architecture-helper build

      - uses: actions/cache@v4
        with:
          path: packages/core/binaries
          key: node-sidecar-${{ matrix.target }}-22.23.3

      - name: Fetch the bundled Node.js runtime
        run: node packages/core/scripts/fetch-node-sidecar.mjs --target "$TARGET"

      - name: Build app and dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
          fi

          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::No Developer ID certificate; ad-hoc signing. Gatekeeper asks on first launch."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
              APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH APPLE_API_KEY_CONTENT
            export APPLE_SIGNING_IDENTITY="-"
          fi

          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for a tagged release."
              exit 1
            fi
            echo "::notice::No updater signing key; building without updater artifacts."
            pnpm tauri build --ci --target "$TARGET" --bundles app,dmg \
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            pnpm tauri build --ci --target "$TARGET" --bundles app,dmg
          fi

      - name: Verify and collect release files
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          set -euo pipefail
          bundle="packages/core/target/$TARGET/release/bundle"
          app="$bundle/macos/Oaklet.app"
          actual_arch="$(lipo -archs "$app/Contents/MacOS/oaklet")"
          echo "Expected $ARCH, built $actual_arch"
          test "$actual_arch" = "$ARCH"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E "Identifier=|TeamIdentifier=|Signature=" || true

          dmg="$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::No .dmg was produced in $bundle/dmg"
            exit 1
          fi

          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            codesign -dv --verbose=4 "$app" 2>&1 | grep -q "Authority=Developer ID Application" \
              || { echo "::error::The app is not signed with a Developer ID Application certificate."; exit 1; }
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            xcrun stapler validate "$dmg"
          else
            echo "::notice::Skipping Gatekeeper and notarization checks for the ad-hoc build."
          fi

          mkdir -p release-assets
          cp "$dmg" release-assets/
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "release-assets/Oaklet_$ARCH.app.zip"

          version="$(node -p "require('./packages/core/tauri.conf.json').version")"
          app_tar="$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          if [ -n "$app_tar" ]; then
            echo "HAS_UPDATER=true" >> "$GITHUB_ENV"
            # Tauri names this artifact Oaklet.app.tar.gz for every macOS
            # architecture, so rename it before both matrix jobs upload it to
            # the same release.
            updater_artifact="release-assets/Oaklet_${version}_${ARCH}.app.tar.gz"
            cp "$app_tar" "$updater_artifact"
            cp "$app_tar.sig" "$updater_artifact.sig"
            node scripts/release/latest-json.mjs fragment \
              --version "$version" \
              --platform "$UPDATER_TARGET" \
              --artifact "$updater_artifact" \
              --signature "$updater_artifact.sig" \
              --output "release-assets/latest.${UPDATER_TARGET}.fragment.json" \
              --notes "See the release notes on GitHub."
          fi

          cd release-assets
          for file in *; do
            case "$file" in
              SHA256SUMS|SHA256SUMS.*|*.fragment.json) continue ;;
            esac
            [ -f "$file" ] && shasum -a 256 "$file"
          done > "SHA256SUMS.${UPDATER_TARGET}"

      # The updater package and its signature prove the download is ours.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.app.zip

      - uses: actions/attest-build-provenance@v4
        if: env.HAS_UPDATER == 'true'
        with:
          subject-path: release-assets/*.app.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: Oaklet-macos-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: release-assets/

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Serialize the three platform publishers so latest.json and SHA256SUMS
      # are merged instead of overwritten.
      group: oaklet-release-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Oaklet-macos-*
          path: release-assets
          merge-multiple: true

      - name: Merge the update manifest and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./packages/core/tauri.conf.json').version")"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Tag $tag does not match tauri.conf.json version $version"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --pattern latest.json --output latest.json --clobber || rm -f latest.json
            gh release download "$tag" --pattern SHA256SUMS --output SHA256SUMS --clobber || rm -f SHA256SUMS
          fi

          fragments=(release-assets/*.fragment.json)
          if [ -f latest.json ]; then
            node scripts/release/latest-json.mjs merge \
              --base latest.json --output release-assets/latest.json \
              --overlay "${fragments[@]}"
          else
            node scripts/release/latest-json.mjs merge \
              --output release-assets/latest.json \
              --overlay "${fragments[@]}"
          fi

          {
            find release-assets -maxdepth 1 -name 'SHA256SUMS.*' -exec cat {} +
            if [ -f SHA256SUMS ]; then cat SHA256SUMS; fi
          } | awk 'NF == 2 && !seen[$2]++' | sort -k2 > release-assets/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.dmg
            release-assets/*.app.zip
            release-assets/*.app.tar.gz
            release-assets/*.app.tar.gz.sig
            release-assets/latest.json
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
          append_body: true
          body: |
            ## Install (macOS)

            Download the `.dmg` for your Mac.

            - Use `_aarch64.dmg` on Apple Silicon (M-series).
            - Use `_x64.dmg` on Intel.

            Open the `.dmg` and drag Oaklet into Applications.

            Builds published without Developer ID credentials are ad-hoc
            signed, and macOS may block the first launch. Try to open Oaklet
            once, then use **System Settings → Privacy & Security → Open
            Anyway** (macOS 15+) or right-click Oaklet → **Open** (macOS 14 and
            earlier). From Terminal, `xattr -dr com.apple.quarantine
            /Applications/Oaklet.app` also clears the block. Signed and
            notarized releases do not need these steps.

            Oaklet updates itself only from **Settings → Updates**. Every
            update package is checked with the minisign key compiled into the
            app.
