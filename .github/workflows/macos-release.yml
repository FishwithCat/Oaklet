name: macOS release

# Builds separate Apple Silicon and Intel Oaklet.app and .dmg bundles.
# Manual runs upload the bundles as workflow artifacts. Pushing a v* tag also
# publishes a GitHub Release.
#
# Signing and notarization are optional. Add these repository secrets to enable
# them (see CONTRIBUTING.md, "Releasing"):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
# Without them the build is ad-hoc signed: it runs, but Gatekeeper asks the
# user to allow it on first launch.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/desktop/pnpm-lock.yaml
            packages/architecture-helper/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir packages/desktop install --frozen-lockfile
          pnpm --dir packages/architecture-helper install --frozen-lockfile

      - name: Build the architecture helper
        # The helper is bundled to plain JavaScript, independent of the host
        # architecture, and Tauri embeds only this directory.
        run: pnpm --dir packages/architecture-helper build

      - name: Build app and dmg
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "::notice::No Developer ID certificate; ad-hoc signing. Gatekeeper asks on first launch."
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            export APPLE_SIGNING_IDENTITY="-"
          fi
          pnpm tauri build --ci --target "$TARGET" --bundles app,dmg

      - name: Verify and collect release files
        run: |
          bundle="packages/core/target/$TARGET/release/bundle"
          app="$bundle/macos/Oaklet.app"
          actual_arch="$(lipo -archs "$app/Contents/MacOS/oaklet")"
          echo "Expected $ARCH, built $actual_arch"
          test "$actual_arch" = "$ARCH"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E "Identifier=|TeamIdentifier=|Signature=" || true

          mkdir -p release-assets
          cp "$bundle"/dmg/*.dmg release-assets/
          ditto -c -k --sequesterRsrc --keepParent \
            "$app" "release-assets/Oaklet_$ARCH.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Oaklet-macos-${{ matrix.arch }}
          retention-days: 14
          if-no-files-found: error
          path: release-assets/

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Oaklet-macos-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Oaklet_*_aarch64.dmg
            release-assets/Oaklet_*_x64.dmg
            release-assets/Oaklet_arm64.app.zip
            release-assets/Oaklet_x86_64.app.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install (macOS)

            Download the `.dmg` for your Mac.

            - Use `_aarch64.dmg` on Apple Silicon (M-series).
            - Use `_x64.dmg` on Intel.

            Open the `.dmg` and drag Oaklet into Applications. If macOS blocks
            the first launch of an ad-hoc signed build, follow the steps below.

            1. Try to open Oaklet once.
            2. macOS 15+: System Settings → Privacy & Security → **Open Anyway**.
               macOS 14 and earlier: right-click Oaklet → **Open**.
            3. Any version, from Terminal:
               `xattr -dr com.apple.quarantine /Applications/Oaklet.app`
